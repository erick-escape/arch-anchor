spring.application.name=arch-anchor
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.file-size-threshold=2MB

# One directory per project, uploaded or imported. Relative to the working directory.
archanchor.projects-dir=uploads
# Inactivity timeout for each network operation while importing a repository.
archanchor.import.timeout-seconds=60
