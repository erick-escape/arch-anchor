<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArchAnchor</title>
    <script>
        // Pick the theme before the first paint, as src/theme/themePreference.ts resolves it:
        // a remembered light or dark choice, else the OS. ThemeProvider takes over once React runs.
        (function () {
            var stored = null;
            try { stored = localStorage.getItem('archanchor.theme'); } catch (e) {}
            var dark = stored === 'dark' ||
                (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        })();
    </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
