<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -4 104 110" width="400" height="423" role="img" aria-label="ArchAnchor">
  <!-- ArchAnchor mark, for light backgrounds (deepNavy chevron, mountainBlue, baseBlue).
       Geometry from graduation/ECSA/talk/preview/mark.svg (measured from the lockup on p.18 of
       2026_talk_unibz_terra.pdf). That file paints its carves white because Google Slides has no
       masks; here the carved shapes are solved as polygons, so the mark sits on any background
       and needs no ids (safe to inline many times on one page). -->
  <!-- chevron: outer triangle minus the inner one (a 14.5u stroke), arms extended to mitered tips, anchor-stock nubs -->
  <g fill="#112749">
    <polygon points="0,71 50,0 100,71 84.49,71 50,21 15.51,71"/>
    <rect x="5.97" y="51.85" width="12.0" height="25" transform="rotate(34.6 11.97 64.35)"/>
    <rect x="82.03" y="51.85" width="12.0" height="25" transform="rotate(-34.6 88.03 64.35)"/>
    <rect x="19.78" y="35.75" width="8" height="4.5" transform="rotate(34.6 23.78 38)"/>
    <rect x="72.22" y="35.75" width="8" height="4.5" transform="rotate(-34.6 76.22 38)"/>
  </g>
  <!-- mountain: centre spire and two shoulders as one silhouette, minus the V notch at its base -->
  <polygon fill="#0E5FB6" points="15.5,87.3 33,63 40.22,73.03 50.5,42 61.0,73.71 68.5,63.5 86,87.3 66.83,87.3 50,72 33.17,87.3"/>
  <!-- base plate -->
  <polygon fill="#9DCAEE" points="50,84 65,92 50,100 35,92"/>
</svg>
