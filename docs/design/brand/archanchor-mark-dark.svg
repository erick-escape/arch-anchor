<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -4 104 110" width="400" height="423" role="img" aria-label="ArchAnchor">
  <!-- ArchAnchor mark, for dark backgrounds (wash chevron, anchorBlue mountain, baseBlue base): deepNavy is 1.22:1 on the dark page and would vanish.
       Geometry from graduation/ECSA/talk/preview/mark.svg (measured from the lockup on p.18 of
       2026_talk_unibz_terra.pdf). That file paints the carves white because Google Slides has no
       masks; here they are real cut-outs, so the mark sits on any background. -->
  <defs>
    <mask id="aa-carve-d"><rect x="-2" y="-4" width="104" height="110" fill="#fff"/><polygon points="50,21 97.6,90 2.4,90" fill="#000"/></mask>
    <mask id="aa-notch-d"><rect x="-2" y="-4" width="104" height="110" fill="#fff"/><polygon points="50,72 70.9,91 29.1,91" fill="#000"/></mask>
  </defs>
  <!-- chevron: outer triangle carved to a 14.5u stroke, arms extended to mitered tips, anchor-stock nubs -->
  <g fill="#EAF3FE">
    <polygon points="50,0 100,71 0,71" mask="url(#aa-carve-d)"/>
    <rect x="5.97" y="51.85" width="12.0" height="25" transform="rotate(34.6 11.97 64.35)"/>
    <rect x="82.03" y="51.85" width="12.0" height="25" transform="rotate(-34.6 88.03 64.35)"/>
    <rect x="19.78" y="35.75" width="8" height="4.5" transform="rotate(34.6 23.78 38)"/>
    <rect x="72.22" y="35.75" width="8" height="4.5" transform="rotate(-34.6 76.22 38)"/>
  </g>
  <!-- mountain: narrow centre spire + two low shoulders, V notch at the base -->
  <g fill="#2287F0" mask="url(#aa-notch-d)">
    <polygon points="50.5,42 65.5,87.3 35.5,87.3"/>
    <polygon points="33,63 50.5,87.3 15.5,87.3"/>
    <polygon points="68.5,63.5 86,87.3 51,87.3"/>
  </g>
  <!-- base plate -->
  <polygon points="50,84 65,92 50,100 35,92" fill="#9DCAEE"/>
</svg>
